name: Sync GitHub with Notion

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  pull_request:
    types: [opened, edited, closed, reopened, ready_for_review, converted_to_draft, synchronize]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: notion-sync-${{ github.repository }}-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  sync-notion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync GitHub event to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ISSUES_DATA_SOURCE_ID: ${{ secrets.NOTION_ISSUES_DATA_SOURCE_ID }}
          NOTION_GITHUB_ASSIGNEE_MAP: ${{ secrets.NOTION_GITHUB_ASSIGNEE_MAP || vars.NOTION_GITHUB_ASSIGNEE_MAP || '{}' }}
          NOTION_VERSION: ${{ vars.NOTION_VERSION || '2025-09-03' }}
          GITHUB_TOKEN: ${{ secrets.GH_ISSUE_FIELDS_TOKEN || github.token }}
          GITHUB_API_VERSION: ${{ vars.GITHUB_API_VERSION || '2026-03-10' }}
          GITHUB_DATE_FIELD_MAP: ${{ vars.GITHUB_DATE_FIELD_MAP || '{"Start":"Start","Start Date":"Start","시작일":"Start","시작 예정일":"Start","Target":"Due Date","Target Date":"Due Date","Due Date":"Due Date","마감일":"Due Date","목표일":"Due Date","완료 목표일":"Due Date"}' }}
          GITHUB_FIELD_MAP: ${{ vars.GITHUB_FIELD_MAP || '{"Priority":"Priority","우선순위":"Priority","Effort":"Estimate","Estimate":"Estimate","작업량":"Estimate","난이도":"Estimate","Domain":"Domain","담당 영역":"Domain","영역":"Domain"}' }}
          GITHUB_ISSUE_FIELD_ID_MAP: ${{ vars.GITHUB_ISSUE_FIELD_ID_MAP || '{"42791012":"Priority","42791013":"Due Date","42791014":"Start","42791015":"Estimate"}' }}
          GITHUB_SYNC_WINDOW_DAYS: ${{ vars.GITHUB_SYNC_WINDOW_DAYS || '9999' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTION_NAME: ${{ github.event.action }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/sync-github-notion.mjs