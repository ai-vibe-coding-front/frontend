name: Sync GitHub with Notion

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  pull_request:
    types: [opened, edited, closed, reopened, ready_for_review, converted_to_draft, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: notion-sync-${{ github.repository }}-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  sync-notion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync GitHub event to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ISSUES_DATA_SOURCE_ID: ${{ secrets.NOTION_ISSUES_DATA_SOURCE_ID }}
          NOTION_GITHUB_ASSIGNEE_MAP: ${{ secrets.NOTION_GITHUB_ASSIGNEE_MAP || vars.NOTION_GITHUB_ASSIGNEE_MAP || '{}' }}
          NOTION_VERSION: ${{ vars.NOTION_VERSION || '2025-09-03' }}
          GITHUB_TOKEN: ${{ secrets.GH_ISSUE_FIELDS_TOKEN || github.token }}
          GITHUB_API_VERSION: ${{ vars.GITHUB_API_VERSION || '2026-03-10' }}
          GITHUB_DATE_FIELD_MAP: ${{ vars.GITHUB_DATE_FIELD_MAP || '{"Start":"Start","Start Date":"Start","Target":"Due Date","Target Date":"Due Date","Due Date":"Due Date"}' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTION_NAME: ${{ github.event.action }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/sync-github-notion.mjs